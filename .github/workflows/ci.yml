name: ci

on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, 'skip-ci')
    steps:
      - run: echo "Running tests"

  # azure:
  #   needs: should-run
  #   strategy:
  #     matrix:
  #       module:
  #         - blob-storage
  #         - container-app
  #         - container-registry
  #         - database/postgres
  #         - observability/alerts
  #         - observability/monitors
  #         - virtual-network
  #     fail-fast: false
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: opentofu/setup-opentofu@v1

  #     - name: init
  #       run: |
  #         cd azure
  #         cd ${{ matrix.module }}
  #         tofu init
  #     - name: validate
  #       run: |
  #         cd azure
  #         cd ${{ matrix.module }}
  #         tofu validate
  #     - name: fmt -check
  #       run: |
  #         cd azure
  #         cd ${{ matrix.module }}
  #         tofu fmt -check

  aws:
    needs: should-run
    strategy:
      matrix:
        module:
          - alb-mtls
          - autoscaling/ecs
          - aws-transfer
          - aws-transfer/iam-role
          - certificate
          - cloudtrail/cloudtrail-protection-scp
          - cloudtrail/log-ingestor
          - cloudtrail/log-producer
          - cloudwatch
          - cloudwatch-kinesis
          - cloudwatch-snowflake
          - circleci-token-rotator
          - cognito
          - ecr
          - ecs
          - ecs-deploy/service
          - ecs-deploy/cluster
          - ecs-task
          - elasticache
          - github-backup
          - global-accelerator
          - http-proxy
          - iam/iam-for-deploy-bot
          - iam/iam-for-guest-humans
          - iam/iam-for-humans
          - iam/iam-policy-for-cross-account-access/destination-account
          - iam/iam-policy-for-cross-account-access/origin-account
          - iam/iam-policy-for-ecs/core
          - iam/iam-policy-for-ecs/taggable-resources
          - iam/iam-policy-for-s3
          - iam/iam-policy-for-secrets
          - iam/iam-policy-for-taggable-resources
          - iam/iam-xray
          - kms-key
          - kms-key-replica
          - lambda
          - multi-stack/app
          - multi-stack/setup
          - nat
          - rds
          - route53domains-dnssec
          - s3
          - s3-private
          - s3-public
          - s3-shared
          - secrets
          - slack/chatbot
          - slack/ecr-scanner-notifier
          - slack/ecs-deployment-failure
          - slack/sentry
          - slack/sns
          - stack/app
          - stack/global
          - stack/region
          - stack/setup
          - vpc
          - vpc-peering
          - vpn
          - xray
        aws-version: ["~> 5.0"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Set AWS Provider Version
        run: |
          cd aws
          cd ${{ matrix.module }}
          # stack/app cannot be pinned to the matrix version: its aurora child module
          # requires aws >= 6.0, so let terraform resolve the real constraints instead.
          if [[ "${{ matrix.module }}" == "stack/app" ]]; then exit 0; fi
          FILE=versions.tf
          if test -f "$FILE"; then
            # tolerate column-aligned assignments, e.g. `version   = "..."`
            sed -i '/aws[[:space:]]*=[[:space:]]*{/,/}/ s/version[[:space:]]*=[[:space:]]*"[^"]*/version = "${{ matrix.aws-version }}/' $FILE

            echo "$FILE exists."
          else
            cat > $FILE <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "${{ matrix.aws-version }}"
              }
            }
            required_version = ">= 1.0"
          }
          EOF
          fi

          # restore canonical formatting (e.g. column alignment) after the rewrite,
          # otherwise the fmt -check step fails on the file this step just edited
          terraform fmt $FILE

          cat $FILE

      - name: init
        run: |
          cd aws
          cd ${{ matrix.module }}
          terraform init

      - name: validate
        run: |
          cd aws
          cd ${{ matrix.module }}
          # the stack/app module must have a provider block because the sub-module "vpc-peering" requires a non-standard "provider
          # see: https://github.com/hashicorp/terraform/issues/28490
          if [[ "${{ matrix.module }}" == "stack/app" ]]; then echo "provider \"aws\" { alias = \"peer\" }" >> vpc-peering.tf; fi
          if [[ "${{ matrix.module }}" == "stack/app" ]]; then echo "provider \"aws\" { alias = \"us-east-1\" }" >> dnssec.tf; fi
          if [[ "${{ matrix.module }}" == "stack/global" ]]; then echo "provider \"aws\" { alias = \"us-east-1\" }" >> versions.tf; fi
          if [[ "${{ matrix.module }}" == "vpc-peering" ]]; then echo "provider \"aws\" { alias = \"peer\" }" >> main.tf; fi
          terraform validate

      - name: fmt -check
        run: |
          cd aws
          cd ${{ matrix.module }}
          terraform fmt -check

  tests:
    needs: should-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # terraform test with mock_provider requires Terraform >= 1.7
      - name: module tests (route53domains-dnssec)
        run: |
          cd aws/route53domains-dnssec
          terraform init
          terraform test

      # validates the stack as a consumer calls it (provider aliases, mTLS + DNSSEC inputs)
      - name: stack/app consumer validation
        run: |
          cd aws/stack/app/tests/validate
          terraform init
          terraform validate

  shell-tests:
    needs: should-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suites shim aws/terraform/curl on PATH, so they need no
      # credentials and make no external calls.
      - name: script/tests
        run: |
          for suite in script/tests/*.sh; do
            echo "::group::$suite"
            bash "$suite"
            echo "::endgroup::"
          done

  misc:
    needs: should-run
    strategy:
      matrix:
        module:
          - cloudflare/zone
          - cloudflare/zero-trust
          - fivetran
          - fivetran/connectors/google_analytics
          - fivetran/connectors/lambda
          - script/database-roles
          - snowflake/cloud
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: init
        run: |
          cd ${{ matrix.module }}
          terraform init

      - name: validate
        run: |
          cd ${{ matrix.module }}
          terraform validate

      - name: fmt -check
        run: |
          cd ${{ matrix.module }}
          terraform fmt -check

  security:
    needs: should-run
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: true
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
